[project]
name = "mantle-check"
version = "0.1.0"
description = "Checks Mantle's templates, kits and laid-out cities against RimWorld's Data/ and draws them, outside the game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.0",
    "pillow>=11.0",
]

[project.scripts]
mantle-check = "mantle_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantle_check"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
